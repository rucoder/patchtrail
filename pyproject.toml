# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchtrail"
version = "0.2.0"
description = "Track kernel patches and stable releases from the mailing lists"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["b4>=0.13"]

[project.scripts]
patchtrail = "patchtrail.cli:run"
ptl = "patchtrail.cli:run"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchtrail = ["schema/*.sql", "data/*", "web/dist/*", "web/dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
